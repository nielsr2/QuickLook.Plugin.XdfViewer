name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest   # WPF / .NET Framework 4.6.2 needs a Windows runner
    # New repos default GITHUB_TOKEN to read-only; the tag-triggered release step below needs
    # write access to create a Release and upload the .qlplugin asset to it.
    permissions:
      contents: write
    steps:
      - name: Checkout (with QuickLook.Common submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build QuickLook.Plugin.XdfViewer.csproj -c Release

      - name: Test
        run: dotnet test QuickLook.Plugin.XdfViewer.Tests -c Debug

      - name: Pack .qlplugin
        run: powershell -File Scripts/pack-zip.ps1 -Configuration Release

      - name: Upload .qlplugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickLook.Plugin.XdfViewer.qlplugin
          path: QuickLook.Plugin.XdfViewer.qlplugin

      # The tag name is the one release input nothing else validates: pack-zip.ps1 stamps
      # the package from $(PluginVersion), so a v1.2.0 tag would happily ship a plugin
      # that reports 1.1.0. Fail the release instead, and reuse the version to pull that
      # release's notes out of the CHANGELOG so the Release page isn't blank (v1.0.0's was).
      - name: Check tag matches PluginVersion, extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v',''
          $props = [xml](Get-Content Directory.Build.props)
          $declared = ($props.Project.PropertyGroup | Where-Object { $_.PluginVersion } |
                       Select-Object -First 1).PluginVersion
          if ($declared.Trim() -ne $version) {
            throw "Tag v$version does not match PluginVersion $($declared.Trim())"
          }
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          $m = [regex]::Match($text, $pattern)
          if (-not $m.Success) { throw "No CHANGELOG section for $version" }
          $m.Groups[1].Value.Trim() | Set-Content RELEASE_NOTES.md -Encoding utf8
          Write-Host "--- release notes ---"
          Get-Content RELEASE_NOTES.md

      # On a version tag (e.g. v1.0.0) also publish the .qlplugin as a GitHub Release asset,
      # which is what the QuickLook plugin list links to for downloads.
      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: QuickLook.Plugin.XdfViewer.qlplugin
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
